[project]
name = "learn-ai-math-from-scratch"
version = "0.1.0"
description = "Learn AI mathematics through NumPy implementations and reproducible experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib==3.10.3",
    "numpy==2.2.6",
]

[dependency-groups]
dev = [
    "ipykernel==6.29.5",
    "jupyterlab==4.4.3",
    "nbclient==0.10.2",
    "nbformat==5.10.4",
]

[tool.uv]
constraint-dependencies = ["pyparsing==3.2.3"]
